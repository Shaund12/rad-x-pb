name: RadXPriceBot CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    name: Build & Test (${{ matrix.configuration }})
    runs-on: windows-latest

    strategy:
      fail-fast: true
      matrix:
        configuration: [ Debug, Release ]

    env:
      SOLUTION: RadXPriceBot.sln
      PROJECT: RadXPriceBot.csproj

    steps:
      # 1) Checkout full history so cache keys and coverage detection work
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Cache NuGet packages
      - name: Cache NuGet
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 3) Install .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 4) Restore dependencies
      - name: dotnet restore
        run: dotnet restore ${{ env.SOLUTION }}

      # 5) Build solution
      - name: dotnet build
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ matrix.configuration }} --no-restore

      # 6) Enforce code formatting
      - name: dotnet format check
        run: dotnet tool install -g dotnet-format && dotnet format --verify-no-changes

      # 7) Run tests + collect coverage
      - name: dotnet test (with coverage)
        run: |
          dotnet test ${{ env.SOLUTION }} \
            --configuration ${{ matrix.configuration }} \
            --no-build \
            --logger "trx;LogFileName=${{ matrix.configuration }}.trx" \
            --collect "XPlat Code Coverage"

      # 8) Upload test results & coverage
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.configuration }}
          path: |
            **/*.trx
            **/coverage.cobertura.xml

      # 9) Publish self-contained single-file EXE
      - name: dotnet publish
        run: |
          dotnet publish ${{ env.PROJECT }} \
            --configuration ${{ matrix.configuration }} \
            --output publish/${{ matrix.configuration }} \
            --self-contained true \
            -r win-x64 \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishReadyToRun=true

      # 10) Package the published output
      - name: Package Application
        run: Compress-Archive \
              -Path publish/${{ matrix.configuration }}/* \
              -DestinationPath RadXPriceBot-${{ matrix.configuration }}.zip

      # 11) Upload the ZIP
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadXPriceBot-${{ matrix.configuration }}
          path: RadXPriceBot-${{ matrix.configuration }}.zip
